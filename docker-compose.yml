# Servicios de apoyo para el desarrollo (TECH_SPEC §14.4). La aplicación Node
# se ejecuta fuera de Docker con «npm run dev».
#   Arrancar: docker compose up -d     Parar: docker compose stop
# Si ya tienes PostgreSQL instalado en el ordenador escuchando en el 5432,
# arranca solo Mailpit: docker compose up -d mailpit
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sanctuary
      POSTGRES_PASSWORD: sanctuary
      POSTGRES_DB: sanctuary
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea también la base de datos de pruebas (solo la primera vez).
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/docker-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sanctuary -d sanctuary']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Interfaz web: http://localhost:8025

volumes:
  postgres-data:
